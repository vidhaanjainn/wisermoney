<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WiserMoney Admin — Client Briefs</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0B1628;
  --navy-2: #112040;
  --navy-3: #1A2F55;
  --navy-4: #243A6A;
  --gold: #D4A843;
  --gold-2: #E8C97A;
  --gold-pale: rgba(212,168,67,0.12);
  --gold-border: rgba(212,168,67,0.25);
  --cream: #F5EDD6;
  --white: #FDFAF4;
  --text: #EAE4D8;
  --text-soft: rgba(234,228,216,0.65);
  --text-muted: rgba(234,228,216,0.38);
  --border: rgba(234,228,216,0.1);
  --border-2: rgba(234,228,216,0.18);
  --sage: #4A9B6F;
  --sage-pale: rgba(74,155,111,0.12);
  --rust: #D4603A;
  --rust-pale: rgba(212,96,58,0.12);
  --teal: #2A9D8F;
  --teal-pale: rgba(42,157,143,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
body::before { content:''; position:fixed; inset:0; background: radial-gradient(circle at 15% 15%, rgba(212,168,67,0.04), transparent 50%), radial-gradient(circle at 85% 85%, rgba(42,157,143,0.03), transparent 50%); pointer-events:none; z-index:0; }

/* LOGIN */
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; position:relative; z-index:1; }
.login-box { background:var(--navy-2); border:1px solid var(--border-2); border-radius:20px; padding:40px 32px; max-width:380px; width:100%; text-align:center; }
.login-logo { font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--white); margin-bottom:6px; }
.login-logo span { color:var(--gold); }
.login-sub { font-size:13px; color:var(--text-muted); margin-bottom:32px; }
.login-box input { width:100%; padding:14px 16px; background:var(--navy-3); border:1.5px solid var(--border-2); border-radius:10px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:22px; text-align:center; letter-spacing:6px; margin-bottom:14px; transition:border-color 0.2s; }
.login-box input:focus { outline:none; border-color:var(--gold); }
.login-box input::placeholder { letter-spacing:2px; font-size:14px; color:var(--text-muted); }
.login-err { font-size:13px; color:#E8856A; margin-bottom:12px; min-height:20px; }
.btn-gold { width:100%; padding:14px; background:linear-gradient(135deg, var(--gold), #E8A020); color:var(--navy); border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.btn-gold:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(212,168,67,0.3); }

/* MAIN APP */
.app { display:none; min-height:100vh; position:relative; z-index:1; }

/* HEADER */
.header { padding:16px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:rgba(11,22,40,0.95); backdrop-filter:blur(12px); position:sticky; top:0; z-index:100; }
.logo { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--white); }
.logo span { color:var(--gold); }
.header-right { display:flex; align-items:center; gap:12px; }
.admin-badge { font-size:10px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase; color:var(--gold); background:var(--gold-pale); border:1px solid var(--gold-border); padding:4px 10px; border-radius:20px; }
.logout-btn { font-size:12px; color:var(--text-muted); cursor:pointer; background:none; border:none; font-family:'DM Sans',sans-serif; padding:4px 8px; transition:color 0.2s; }
.logout-btn:hover { color:var(--text); }

/* LAYOUT */
.layout { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 57px); }
@media(max-width:768px){ .layout { grid-template-columns:1fr; } }

/* SIDEBAR */
.sidebar { border-right:1px solid var(--border); background:var(--navy-2); display:flex; flex-direction:column; }
.sidebar-top { padding:16px; border-bottom:1px solid var(--border); }
.search-wrap { position:relative; }
.search-wrap input { width:100%; padding:10px 14px 10px 36px; background:var(--navy-3); border:1.5px solid var(--border-2); border-radius:9px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:14px; transition:border-color 0.2s; }
.search-wrap input:focus { outline:none; border-color:var(--gold); }
.search-wrap input::placeholder { color:var(--text-muted); }
.search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--text-muted); pointer-events:none; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
.stat-box { background:var(--navy-3); border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; }
.stat-box .n { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--gold); }
.stat-box .l { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
.client-list { flex:1; overflow-y:auto; padding:8px; }
.client-list::-webkit-scrollbar { width:4px; }
.client-list::-webkit-scrollbar-track { background:transparent; }
.client-list::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:2px; }
.client-item { padding:12px 14px; border-radius:10px; cursor:pointer; transition:all 0.18s; margin-bottom:4px; border:1px solid transparent; }
.client-item:hover { background:var(--navy-3); }
.client-item.active { background:var(--gold-pale); border-color:var(--gold-border); }
.ci-name { font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px; }
.ci-meta { font-size:11px; color:var(--text-muted); display:flex; gap:8px; }
.ci-arch { font-size:11px; color:var(--gold); margin-top:3px; }
.ci-flags { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
.flag { font-size:10px; padding:2px 7px; border-radius:10px; font-weight:500; }
.flag-red { background:var(--rust-pale); color:#E8856A; }
.flag-yellow { background:var(--gold-pale); color:var(--gold-2); }
.flag-green { background:var(--sage-pale); color:var(--sage); }
.empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px; }

/* DETAIL PANEL */
.detail { padding:28px 32px; overflow-y:auto; }
@media(max-width:768px){ .detail { padding:20px 16px; } }
.no-selection { display:flex; align-items:center; justify-content:center; height:100%; text-align:center; }
.no-selection p { color:var(--text-muted); font-size:14px; max-width:200px; line-height:1.6; }

/* BRIEF SECTIONS */
.brief-header { margin-bottom:24px; }
.brief-name { font-family:'Fraunces',serif; font-size:28px; font-weight:400; color:var(--white); margin-bottom:4px; }
.brief-meta { font-size:13px; color:var(--text-muted); display:flex; gap:16px; flex-wrap:wrap; }
.brief-meta span { display:flex; align-items:center; gap:4px; }

.arch-strip { background:linear-gradient(135deg, var(--navy-3), var(--navy-4)); border:1px solid var(--gold-border); border-radius:14px; padding:18px 20px; margin-bottom:16px; display:flex; align-items:center; gap:16px; }
.arch-emoji { font-size:36px; flex-shrink:0; }
.arch-info { flex:1; }
.arch-type { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
.arch-name-b { font-family:'Fraunces',serif; font-size:20px; color:var(--white); margin-bottom:4px; }
.arch-tag-b { font-size:12px; color:var(--text-muted); line-height:1.4; }
.risk-chip { background:var(--gold-pale); border:1px solid var(--gold-border); border-radius:8px; padding:8px 14px; text-align:center; flex-shrink:0; }
.risk-chip .rn { font-family:'Fraunces',serif; font-size:22px; color:var(--gold); }
.risk-chip .rl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }

.section { margin-bottom:16px; }
.sec-title { font-size:10px; font-weight:500; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }

/* GRID CARDS */
.data-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
.data-cell { background:var(--navy-2); border:1px solid var(--border); border-radius:9px; padding:12px 14px; }
.data-cell .dl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
.data-cell .dv { font-family:'Fraunces',serif; font-size:18px; font-weight:500; color:var(--white); }
.data-cell .dv.gold { color:var(--gold); }
.data-cell .dv.green { color:var(--sage); }
.data-cell .dv.red { color:var(--rust); }
.data-cell .ds { font-size:11px; color:var(--text-muted); margin-top:2px; }

/* ALERT CARDS */
.alert { border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; }
.alert-red { background:var(--rust-pale); border:1px solid rgba(212,96,58,0.3); }
.alert-yellow { background:var(--gold-pale); border:1px solid var(--gold-border); }
.alert-green { background:var(--sage-pale); border:1px solid rgba(74,155,111,0.3); }
.alert-teal { background:var(--teal-pale); border:1px solid rgba(42,157,143,0.3); }
.alert-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.alert-body strong { display:block; font-size:12px; font-weight:500; margin-bottom:2px; }
.alert-body p { font-size:12px; color:var(--text-muted); line-height:1.4; }
.alert-red .alert-body strong { color:#E8856A; }
.alert-yellow .alert-body strong { color:var(--gold-2); }
.alert-green .alert-body strong { color:var(--sage); }
.alert-teal .alert-body strong { color:var(--teal); }

/* BEHAVIOURAL TABLE */
.b-table { width:100%; border-collapse:collapse; }
.b-table tr { border-bottom:1px solid var(--border); }
.b-table tr:last-child { border-bottom:none; }
.b-table td { padding:10px 0; font-size:13px; vertical-align:top; }
.b-table td:first-child { color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; width:80px; padding-right:12px; padding-top:12px; }
.b-table .q { color:var(--text-soft); font-size:13px; margin-bottom:4px; }
.b-table .a { color:var(--white); font-size:13px; font-weight:500; }
.b-score-bar { display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
.b-score-bar .label { font-size:11px; color:var(--text-muted); white-space:nowrap; }
.b-track { flex:1; background:var(--border); border-radius:3px; height:6px; }
.b-fill { height:6px; border-radius:3px; background:linear-gradient(90deg, var(--sage), var(--gold), var(--rust)); }
.b-val { font-size:13px; font-weight:500; color:var(--white); white-space:nowrap; }

/* ALLOCATION BARS */
.alloc-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.alloc-lbl { font-size:12px; color:var(--text-soft); width:90px; flex-shrink:0; }
.alloc-track { flex:1; background:var(--border); border-radius:3px; height:7px; }
.alloc-fill { height:7px; border-radius:3px; }
.alloc-pct { font-size:13px; font-weight:500; color:var(--text); width:32px; text-align:right; flex-shrink:0; }

/* WHAT-IF */
.wi-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
@media(max-width:500px){ .wi-grid { grid-template-columns:1fr; } }
.wi-box { background:var(--navy-2); border:1px solid var(--border); border-radius:9px; padding:12px; text-align:center; }
.wi-box.best { border-color:var(--gold-border); background:var(--gold-pale); }
.wi-strategy { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.wi-rate { font-size:11px; color:var(--text-muted); margin-bottom:8px; }
.wi-amt { font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--text); }
.wi-box.best .wi-amt { color:var(--gold); }

/* INSIGHTS */
.insight-row { display:flex; gap:10px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.insight-row:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.ins-dot { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.ins-dot.str { background:var(--sage-pale); }
.ins-dot.cau { background:var(--rust-pale); }
.ins-dot.act { background:var(--gold-pale); }
.ins-dot.ins { background:var(--teal-pale); }
.insight-row h4 { font-size:12px; font-weight:500; color:var(--white); margin-bottom:3px; }
.insight-row p { font-size:12px; color:var(--text-muted); line-height:1.4; }

/* NOTES */
.notes-area { width:100%; padding:12px 14px; background:var(--navy-3); border:1.5px solid var(--border-2); border-radius:9px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:13px; line-height:1.6; resize:vertical; min-height:100px; transition:border-color 0.2s; }
.notes-area:focus { outline:none; border-color:var(--gold); }
.notes-area::placeholder { color:var(--text-muted); }
.save-note-btn { margin-top:8px; padding:9px 18px; background:var(--gold-pale); border:1px solid var(--gold-border); border-radius:8px; color:var(--gold-2); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; }
.save-note-btn:hover { background:rgba(212,168,67,0.2); }
.save-note-btn.saved { color:var(--sage); background:var(--sage-pale); border-color:rgba(74,155,111,0.3); }

/* COMPOUNDING */
.c-table { width:100%; border-collapse:collapse; }
.c-table th { font-size:10px; font-weight:500; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-muted); text-align:left; padding:8px 0; border-bottom:1px solid var(--border); }
.c-table td { padding:11px 0; font-size:13px; border-bottom:1px solid var(--border); }
.c-table tr:last-child td { border-bottom:none; }
.c-table .corp { font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--white); }
.c-table .agg { color:var(--gold); font-size:13px; font-weight:500; }

/* TAGS */
.tag-row { display:flex; flex-wrap:wrap; gap:6px; }
.tag { padding:4px 10px; border-radius:12px; font-size:11px; font-weight:500; background:var(--navy-3); border:1px solid var(--border-2); color:var(--text-soft); }
.tag.active { border-color:var(--gold-border); color:var(--gold-2); background:var(--gold-pale); }

/* LOADING / EMPTY */
.loading-dots { display:flex; gap:6px; justify-content:center; padding:40px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.2s ease-in-out infinite; }
.dot:nth-child(2){ animation-delay:0.2s; }
.dot:nth-child(3){ animation-delay:0.4s; }
@keyframes pulse { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }

.hidden { display:none !important; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">Wiser<span>Money</span></div>
    <div class="login-sub">Admin · Client Briefs</div>
    <input type="password" id="pinInput" placeholder="Enter PIN" maxlength="6" onkeydown="if(event.key==='Enter')checkPin()"/>
    <div class="login-err" id="pinErr"></div>
    <button class="btn-gold" onclick="checkPin()">Enter Dashboard →</button>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div class="app" id="mainApp">

  <header class="header">
    <div class="logo">Wiser<span>Money</span> <span style="font-size:13px;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-weight:300">/ Admin</span></div>
    <div class="header-right">
      <div class="admin-badge">Private</div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="filterClients()"/>
        </div>
        <div class="stats-row" id="statsRow">
          <div class="stat-box"><div class="n" id="statTotal">—</div><div class="l">Total</div></div>
          <div class="stat-box"><div class="n" id="statWaitlist">—</div><div class="l">Waitlist</div></div>
          <div class="stat-box"><div class="n" id="statToday">—</div><div class="l">Today</div></div>
        </div>
      </div>
      <div class="client-list" id="clientList">
        <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>

    <!-- DETAIL -->
    <div class="detail" id="detailPanel">
      <div class="no-selection">
        <p>← Select a client to view their full brief</p>
      </div>
    </div>

  </div>
</div>

<script>
// ── CONFIG ──
const PIN = '2580'; // Change this to your preferred PIN
const SB_URL = 'https://hjuwbgmsgwezpnqwpcve.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdXdiZ21zZ3dlenBucXdwY3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjUyMjIsImV4cCI6MjA5MDQ0MTIyMn0.GjN0DpEgjwikw7hJ0vKqNfyEPzFd7qAkTcKSMCL5C4Q';

const ARCHETYPES = {
  'The Anxious Saver':         { emoji:'🛡️' },
  'The Cautious Accumulator':  { emoji:'🐢' },
  'The Balanced Builder':      { emoji:'⚖️' },
  'The Confident Investor':    { emoji:'📈' },
  'The Aggressive Compounder': { emoji:'🚀' }
};

const SCENARIOS = [
  { text:'Portfolio drops 25% in 2 months — what do you do?' },
  { text:'You get ₹1 lakh unexpectedly — first instinct?' },
  { text:'Friend gives a "sure shot" 10x stock tip — you...' },
  { text:'How often do you check your portfolio?' },
  { text:'Financial success in 10 years looks like...' }
];

const SCENARIO_OPTIONS = [
  ['Panic sell','Do nothing but lose sleep','Hold steady','Buy more — discount sale'],
  ['FD — safety first','Pay off loan/EMI','Add to SIPs/MFs','Buy individual stocks'],
  ['Invest big chunk','Small amount just in case','Research first, small bet','Ignore it — tips don\'t work'],
  ['Multiple times a day','Every few days','Once a month','Quarterly or less'],
  ['No loans, stable job','₹50L+ corpus, own house','Not need job if I choose','Full FI, multiple income streams']
];

const PATH_RATES = { savings:6.5, lic:4.5, mf:10.5, stocks:10, mix:8.5, none:3.5 };
const PATH_LABELS = { savings:'Savings/FD', lic:'LIC/Endowment', mf:'Mutual Funds', stocks:'Stocks', mix:'Mixed Portfolio', none:'Not Invested Yet' };
const ALLOC_COLORS = { equity:'#D4A843', debt:'#4A9B6F', gold:'#E8C97A', emergency:'#D4603A' };
const ALLOC_LABELS = { equity:'Equity MFs', debt:'Debt / FD', gold:'Gold / SGBs', emergency:'Emergency' };

let allClients = [];
let filteredClients = [];
let selectedId = null;
let notes = {};

// ── AUTH ──
function checkPin() {
  const val = document.getElementById('pinInput').value;
  if (val === PIN) {
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('mainApp').style.display = 'block';
    loadClients();
  } else {
    document.getElementById('pinErr').textContent = 'Incorrect PIN. Try again.';
    document.getElementById('pinInput').value = '';
    setTimeout(() => document.getElementById('pinErr').textContent = '', 3000);
  }
}

function logout() {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('pinInput').value = '';
}

// ── LOAD DATA ──
async function loadClients() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/wisermoney_profiles?select=*&order=created_at.desc`, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    });
    allClients = await res.json();
    filteredClients = [...allClients];
    renderStats();
    renderList();
  } catch(e) {
    document.getElementById('clientList').innerHTML = '<div style="padding:20px;text-align:center;font-size:13px;color:var(--rust)">Failed to load. Check connection.</div>';
  }
}

// ── STATS ──
function renderStats() {
  const today = new Date().toDateString();
  const todayCount = allClients.filter(c => new Date(c.created_at).toDateString() === today).length;
  const waitlistCount = allClients.filter(c => c.course_waitlist).length;
  document.getElementById('statTotal').textContent = allClients.length;
  document.getElementById('statWaitlist').textContent = waitlistCount;
  document.getElementById('statToday').textContent = todayCount;
}

// ── FILTER ──
function filterClients() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filteredClients = q ? allClients.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q) ||
    (c.city||'').toLowerCase().includes(q) ||
    (c.archetype||'').toLowerCase().includes(q)
  ) : [...allClients];
  renderList();
}

// ── RENDER LIST ──
function renderList() {
  if (!filteredClients.length) {
    document.getElementById('clientList').innerHTML = '<div class="empty-state">No clients found.</div>';
    return;
  }
  document.getElementById('clientList').innerHTML = filteredClients.map(c => {
    const arch = ARCHETYPES[c.archetype] || { emoji:'📊' };
    const aiData = safeJSON(c.ai_report);
    const flags = getFlags(c, aiData);
    const date = new Date(c.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
    return `
      <div class="client-item ${c.id === selectedId ? 'active':''}" onclick="selectClient('${c.id}')">
        <div class="ci-name">${c.name || 'Unknown'}</div>
        <div class="ci-meta">
          <span>${c.email || ''}</span>
          <span>${date}</span>
        </div>
        <div class="ci-arch">${arch.emoji} ${c.archetype || '—'}</div>
        <div class="ci-flags">${flags}</div>
      </div>
    `;
  }).join('');
}

function getFlags(c, aiData) {
  const flags = [];
  if (aiData.termInsurance === 'no' || aiData.termInsurance === 'dontknow') flags.push('<span class="flag flag-red">No Term</span>');
  if (aiData.licPolicy === 'yes') flags.push('<span class="flag flag-yellow">Has LIC</span>');
  if (aiData.healthInsurance === 'no') flags.push('<span class="flag flag-red">No Health</span>');
  if (aiData.healthInsurance === 'employer') flags.push('<span class="flag flag-yellow">Employer Health Only</span>');
  if (c.course_waitlist) flags.push('<span class="flag flag-green">Waitlist</span>');
  if (aiData.experience === 'new') flags.push('<span class="flag flag-yellow">New Investor</span>');
  return flags.join('');
}

// ── SELECT CLIENT ──
function selectClient(id) {
  selectedId = id;
  const client = allClients.find(c => c.id === id);
  if (!client) return;
  renderList(); // re-render to show active state
  renderDetail(client);
}

// ── SAFE JSON ──
function safeJSON(str) {
  try { return JSON.parse(str) || {}; } catch(e) { return {}; }
}

// ── FORMAT ──
function fmt(n) {
  if (!n || isNaN(n)) return '₹0';
  n = parseFloat(n);
  if (n >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
  if (n >= 100000) return '₹' + (n/100000).toFixed(1) + 'L';
  if (n >= 1000) return '₹' + (n/1000).toFixed(1) + 'K';
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function compound(sip, rate, years) {
  const r = rate/100/12, n = years*12;
  return sip * ((Math.pow(1+r,n)-1)/r) * (1+r);
}

function compoundLump(p, rate, years) {
  return p * Math.pow(1+rate/100, years);
}

// ── RENDER DETAIL ──
function renderDetail(c) {
  const aiData = safeJSON(c.ai_report);
  const bAnswers = safeJSON(typeof c.behavioural_answers === 'string' ? c.behavioural_answers : JSON.stringify(c.behavioural_answers));
  const alloc = safeJSON(typeof c.allocation === 'string' ? c.allocation : JSON.stringify(c.allocation));
  const arch = ARCHETYPES[c.archetype] || { emoji:'📊' };
  const insights = aiData.insights || [];
  const sip = parseFloat(c.recommended_sip) || 0;
  const cagr = parseFloat(c.suggested_cagr) || 11;
  const existing = parseFloat(c.existing_investments) || 0;
  const income = parseFloat(c.monthly_income) || 0;
  const expenses = parseFloat(c.monthly_expenses) || 0;
  const emi = parseFloat(c.monthly_emi) || 0;
  const surplus = income - expenses - emi;
  const horizon = parseInt(c.time_horizon) || 10;
  const moneyWhere = aiData.moneyWhere || c.money_where || 'savings';
  const currentRate = PATH_RATES[moneyWhere] || 7;
  const submittedDate = new Date(c.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const savedNote = notes[c.id] || '';

  // Insurance alerts
  let insuranceAlerts = '';
  if (aiData.termInsurance === 'no' || aiData.termInsurance === 'dontknow') {
    insuranceAlerts += `<div class="alert alert-red"><div class="alert-icon">🚨</div><div class="alert-body"><strong>No Term Insurance</strong><p>At age ${c.age}, this is urgent. ₹1Cr cover costs ~₹7–12K/year. Discuss this first on the call.</p></div></div>`;
  } else if (aiData.termInsurance === 'yes') {
    insuranceAlerts += `<div class="alert alert-green"><div class="alert-icon">✅</div><div class="alert-body"><strong>Has Term Insurance</strong><p>Good foundation. Verify sum assured is adequate (minimum 10–15x annual income = ${fmt(income*12*12)}).</p></div></div>`;
  }
  if (aiData.licPolicy === 'yes') {
    insuranceAlerts += `<div class="alert alert-yellow"><div class="alert-icon">⚠️</div><div class="alert-body"><strong>Active LIC/Endowment Policy</strong><p>Likely earning 4–5% CAGR. Opportunity cost is significant. Explore surrendering or making it paid-up and redirecting premium to MFs.</p></div></div>`;
  }
  if (aiData.healthInsurance === 'no') {
    insuranceAlerts += `<div class="alert alert-red"><div class="alert-icon">🚨</div><div class="alert-body"><strong>No Health Insurance</strong><p>Critical gap. One hospitalisation can wipe their savings. Recommend ₹5–10L personal floater immediately.</p></div></div>`;
  } else if (aiData.healthInsurance === 'employer') {
    insuranceAlerts += `<div class="alert alert-yellow"><div class="alert-icon">⚠️</div><div class="alert-body"><strong>Employer Cover Only</strong><p>Ends if they switch jobs or go freelance. Personal top-up plan recommended.</p></div></div>`;
  }

  // Behavioural answers
  const bRows = Object.entries(bAnswers).map(([key, val], i) => {
    const qIdx = parseInt(key.replace('q','')) - 1;
    const q = SCENARIOS[qIdx];
    const opts = SCENARIO_OPTIONS[qIdx];
    const answer = opts ? (opts[val.idx] || 'Unknown') : 'Unknown';
    return `<tr>
      <td>Q${qIdx+1}</td>
      <td>
        <div class="q">${q ? q.text : 'Question'}</div>
        <div class="a">${answer} <span style="color:var(--text-muted);font-weight:300">(score: ${val.score})</span></div>
      </td>
    </tr>`;
  }).join('');

  const bScore = Object.values(bAnswers).reduce((a,v) => a+(v.score||0), 0);
  const bPct = Math.round((bScore/50)*100);

  // Allocation bars
  const allocHTML = Object.keys(ALLOC_LABELS).map(k => {
    const v = alloc[k] || 0;
    return `<div class="alloc-row">
      <span class="alloc-lbl">${ALLOC_LABELS[k]}</span>
      <div class="alloc-track"><div class="alloc-fill" style="width:${v}%;background:${ALLOC_COLORS[k]}"></div></div>
      <span class="alloc-pct">${v}%</span>
    </div>`;
  }).join('');

  // Compounding
  const compRows = [10,20,30].map(y => {
    const base = compound(sip, cagr, y);
    const agg = compound(sip, 14, y);
    return `<tr>
      <td style="color:var(--text-soft)">${y} yrs</td>
      <td><span class="corp">${fmt(base)}</span> <span style="font-size:10px;color:var(--text-muted)">${cagr}%</span></td>
      <td><span class="agg">${fmt(agg)}</span></td>
    </tr>`;
  }).join('');

  // What-if
  let whatIfHTML = '';
  if (existing > 0) {
    const wiInactive = compoundLump(existing, 3.5, horizon);
    const wiCurrent = compoundLump(existing, currentRate, horizon);
    const wiOptimised = compoundLump(existing, cagr, horizon);
    whatIfHTML = `
      <div class="section">
        <div class="sec-title">🔍 What-If Panel — Existing ${fmt(existing)} over ${horizon} years</div>
        <div class="wi-grid">
          <div class="wi-box"><div class="wi-strategy">Doing Nothing</div><div class="wi-rate">3.5%</div><div class="wi-amt">${fmt(wiInactive)}</div></div>
          <div class="wi-box"><div class="wi-strategy">${PATH_LABELS[moneyWhere]||'Current'}</div><div class="wi-rate">${currentRate}%</div><div class="wi-amt">${fmt(wiCurrent)}</div></div>
          <div class="wi-box best"><div class="wi-strategy">Optimised</div><div class="wi-rate">${cagr}%</div><div class="wi-amt">${fmt(wiOptimised)}</div></div>
        </div>
      </div>
    `;
  }

  // Comfort tags
  const comfortTags = (aiData.comfort||[]).map(t => `<span class="tag active">${t}</span>`).join('') || '<span style="font-size:12px;color:var(--text-muted)">Not specified</span>';

  const html = `
    <div class="brief-header">
      <div class="brief-name">${c.name}</div>
      <div class="brief-meta">
        <span>📧 ${c.email}</span>
        ${c.phone ? `<span>📱 ${c.phone}</span>` : ''}
        ${c.city ? `<span>📍 ${c.city}</span>` : ''}
        <span>🎂 Age ${c.age}</span>
        <span>🕐 ${submittedDate}</span>
        ${c.course_waitlist ? '<span style="color:var(--gold)">🎓 Course Waitlist</span>' : ''}
      </div>
    </div>

    <!-- ARCHETYPE -->
    <div class="arch-strip">
      <div class="arch-emoji">${arch.emoji}</div>
      <div class="arch-info">
        <div class="arch-type">Investor Archetype</div>
        <div class="arch-name-b">${c.archetype || '—'}</div>
        <div class="arch-tag-b">Risk Score: ${c.risk_score}/10</div>
      </div>
      <div class="risk-chip">
        <div class="rn">${c.risk_score}/10</div>
        <div class="rl">Risk Score</div>
      </div>
    </div>

    <!-- FINANCIALS -->
    <div class="section">
      <div class="sec-title">💰 Financial Snapshot</div>
      <div class="data-grid">
        <div class="data-cell"><div class="dl">Monthly Income</div><div class="dv gold">${fmt(income)}</div></div>
        <div class="data-cell"><div class="dl">Expenses</div><div class="dv">${fmt(expenses)}</div></div>
        <div class="data-cell"><div class="dl">EMIs</div><div class="dv ${emi>0?'red':''}">${fmt(emi)}</div></div>
        <div class="data-cell"><div class="dl">Monthly Surplus</div><div class="dv ${surplus>0?'green':'red'}">${fmt(surplus)}</div></div>
        <div class="data-cell"><div class="dl">Recommended SIP</div><div class="dv gold">${fmt(sip)}</div><div class="ds">~70% of surplus</div></div>
        <div class="data-cell"><div class="dl">Existing Corpus</div><div class="dv">${fmt(existing)}</div><div class="ds">${PATH_LABELS[moneyWhere]||'—'}</div></div>
      </div>
      <div style="margin-top:10px" class="data-grid">
        <div class="data-cell"><div class="dl">Primary Goal</div><div class="dv" style="font-size:14px">${c.primary_goal||'—'}</div></div>
        <div class="data-cell"><div class="dl">Time Horizon</div><div class="dv">${c.time_horizon} yrs</div></div>
        <div class="data-cell"><div class="dl">Experience</div><div class="dv" style="font-size:13px">${aiData.experience||'—'}</div></div>
      </div>
    </div>

    <!-- INSURANCE FLAGS -->
    <div class="section">
      <div class="sec-title">🛡️ Insurance & Protection</div>
      ${insuranceAlerts || '<div class="alert alert-green"><div class="alert-icon">✅</div><div class="alert-body"><strong>Good insurance coverage</strong><p>No major protection gaps detected.</p></div></div>'}
    </div>

    <!-- INVESTMENT COMFORT -->
    <div class="section">
      <div class="sec-title">🎯 Investment Comfort</div>
      <div class="tag-row">${comfortTags}</div>
    </div>

    <!-- ALLOCATION -->
    <div class="section">
      <div class="sec-title">📊 Recommended Allocation</div>
      ${allocHTML}
    </div>

    ${whatIfHTML}

    <!-- BEHAVIOURAL -->
    <div class="section">
      <div class="sec-title">🧠 Behavioural Profile</div>
      <table class="b-table">${bRows}</table>
      <div class="b-score-bar">
        <span class="label">Risk Tolerance Score</span>
        <div class="b-track"><div class="b-fill" style="width:${bPct}%"></div></div>
        <span class="b-val">${bScore}/50</span>
      </div>
    </div>

    <!-- COMPOUNDING -->
    <div class="section">
      <div class="sec-title">📈 SIP Compounding (${fmt(sip)}/month)</div>
      <table class="c-table">
        <thead><tr><th>Horizon</th><th>Their Path (${cagr}%)</th><th>Aggressive (14%)</th></tr></thead>
        <tbody>${compRows}</tbody>
      </table>
    </div>

    <!-- AI INSIGHTS -->
    ${insights.length ? `
    <div class="section">
      <div class="sec-title">💡 AI-Generated Insights</div>
      ${insights.map(ins => `
        <div class="insight-row">
          <div class="ins-dot ${ins.type||'act'}">${ins.icon||'💡'}</div>
          <div><h4>${ins.title}</h4><p>${ins.text}</p></div>
        </div>
      `).join('')}
    </div>
    ` : ''}

    <!-- PRE-CALL NOTES -->
    <div class="section">
      <div class="sec-title">📝 Your Pre-Call Notes</div>
      <textarea class="notes-area" id="notesArea_${c.id}" placeholder="Add your notes before the call — questions to ask, observations, strategy ideas..." onchange="saveNote('${c.id}')">${savedNote}</textarea>
      <button class="save-note-btn" id="saveBtn_${c.id}" onclick="saveNote('${c.id}')">Save Notes</button>
    </div>
  `;

  document.getElementById('detailPanel').innerHTML = html;
}

// ── NOTES (local storage) ──
function saveNote(id) {
  const val = document.getElementById('notesArea_'+id)?.value || '';
  notes[id] = val;
  localStorage.setItem('wm_notes_'+id, val);
  const btn = document.getElementById('saveBtn_'+id);
  if (btn) { btn.textContent = '✓ Saved'; btn.classList.add('saved'); setTimeout(()=>{ btn.textContent='Save Notes'; btn.classList.remove('saved'); }, 2000); }
}

// Load notes from localStorage on init
function loadNotes() {
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('wm_notes_')) {
      const id = key.replace('wm_notes_','');
      notes[id] = localStorage.getItem(key);
    }
  }
}

// ── INIT ──
loadNotes();
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });
</script>
